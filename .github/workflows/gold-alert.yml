
name: Gold Telegram Alerts (free)

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup, test, status or scan'
        type: choice
        required: true
        default: test
        options:
          - setup
          - test
          - status
          - scan

permissions:
  contents: write

concurrency:
  group: gold-telegram-alert
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan market / setup / test / status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          MODE: ${{ github.event.inputs.mode || 'scan' }}
        run: python ai_overlay.py --mode "$MODE"
